name: Feature request
description: 建议功能优化
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景、目标与受影响角色
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的交互/接口和接受标准
  - type: textarea
    id: security
    attributes:
      label: 隐私、内容审核和权限影响
